# ============================================================================
# RipCatch v2.0 - Docker Compose Configuration
# Supports both CPU and GPU deployments
# ============================================================================

version: '3.8'

services:
  # =========================================================================
  # CPU Service (Default)
  # =========================================================================
  ripcatch-cpu:
    container_name: ripcatch-cpu
    build:
      context: .
      dockerfile: Dockerfile
    image: naga-narala/ripcatch:latest-cpu
    ports:
      - "7860:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    volumes:
      # Mount for persistent uploads/outputs
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.ripcatch.version=2.0"
      - "com.ripcatch.description=RipCatch CPU Service"

  # =========================================================================
  # GPU Service (Requires NVIDIA Docker Runtime)
  # =========================================================================
  ripcatch-gpu:
    container_name: ripcatch-gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: naga-narala/ripcatch:latest-gpu
    ports:
      - "7861:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.ripcatch.version=2.0"
      - "com.ripcatch.description=RipCatch GPU Service"
    profiles:
      - gpu

# Volumes for persistent data
volumes:
  uploads:
  outputs:

# Networks
networks:
  default:
    name: ripcatch-network
